basePath: /api/v1
definitions:
  dto.LastProfileDownloadResponse:
    properties:
      exists:
        type: boolean
      last_downloaded_at:
        type: string
      last_downloaded_hash:
        type: string
    required:
    - exists
    type: object
  dto.OAuthAuthorizeRequest:
    properties:
      redirect_uri:
        type: string
    required:
    - redirect_uri
    type: object
  dto.OAuthAuthorizeResponse:
    properties:
      url:
        type: string
    required:
    - url
    type: object
  dto.OAuthCallbackRequest:
    properties:
      url:
        type: string
    required:
    - url
    type: object
  dto.OAuthCallbackResponse:
    type: object
  dto.Profile:
    properties:
      data:
        type: string
      hash:
        type: string
      updated_at:
        type: string
    required:
    - data
    - hash
    - updated_at
    type: object
  dto.Server:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      profile:
        $ref: '#/definitions/dto.Profile'
    required:
    - id
    - name
    type: object
  dto.UpdateProfileRequest:
    properties:
      profile_data:
        type: string
    required:
    - profile_data
    type: object
  dto.User:
    properties:
      email:
        type: string
      id:
        type: string
      is_admin:
        type: boolean
      name:
        type: string
      picture:
        type: string
    required:
    - email
    - id
    - is_admin
    - name
    - picture
    type: object
info:
  contact: {}
  title: OpenVPN Client Zone API
  version: "1.0"
paths:
  /auth/logout:
    post:
      operationId: Logout
      responses:
        "204":
          description: No Content
      summary: Initiate logout
      tags:
      - auth
  /oauth/authorize:
    post:
      operationId: StartOAuth
      parameters:
      - description: OAuth2 authorization request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OAuthAuthorizeRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.OAuthAuthorizeResponse'
      summary: Initiate OAuth2 authorization flow
      tags:
      - oauth
  /oauth/callback:
    post:
      operationId: FinishOAuth
      parameters:
      - description: OAuth2 callback request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OAuthCallbackRequest'
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/dto.OAuthCallbackResponse'
      summary: Handle OAuth2 callback
      tags:
      - oauth
  /servers:
    get:
      operationId: GetUserServers
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.Server'
            type: array
      summary: Get servers that the user has access to
      tags:
      - servers
  /servers/{serverId}/profile:
    delete:
      operationId: DeleteServerProfile
      parameters:
      - description: Server ID
        in: path
        name: serverId
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Delete server profile
      tags:
      - servers
    get:
      operationId: DownloadServerProfile
      parameters:
      - description: Server ID
        in: path
        name: serverId
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: File stream
          schema:
            type: file
      summary: Download server profile
      tags:
      - servers
    post:
      operationId: UpdateServerProfile
      parameters:
      - description: Server ID
        in: path
        name: serverId
        required: true
        type: integer
      - description: Profile data
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Profile'
      summary: Update server profile
      tags:
      - servers
  /servers/{serverId}/profile/last-download:
    get:
      operationId: GetLastProfileDownload
      parameters:
      - description: Server ID
        in: path
        name: serverId
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LastProfileDownloadResponse'
      summary: Get last profile download information
      tags:
      - servers
  /users/me:
    get:
      description: Get the authenticated user's information.
      operationId: GetMe
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.User'
      summary: Get authenticated user info
      tags:
      - user
swagger: "2.0"
