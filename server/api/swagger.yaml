basePath: /api/v1
definitions:
  dto.OAuthAuthorizeRequest:
    properties:
      redirect_uri:
        type: string
    required:
    - redirect_uri
    type: object
  dto.OAuthAuthorizeResponse:
    properties:
      url:
        type: string
    required:
    - url
    type: object
  dto.OAuthCallbackRequest:
    properties:
      url:
        type: string
    required:
    - url
    type: object
  dto.OAuthCallbackResponse:
    type: object
  dto.Profile:
    properties:
      data:
        type: string
      hash:
        type: string
      updated_at:
        type: string
    required:
    - data
    - hash
    - updated_at
    type: object
  dto.Server:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      profile:
        $ref: '#/definitions/dto.Profile'
    required:
    - id
    - name
    type: object
  dto.User:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      picture:
        type: string
    required:
    - email
    - id
    - name
    - picture
    type: object
info:
  contact: {}
  title: OpenVPN Client Zone API
  version: "1.0"
paths:
  /auth/logout:
    post:
      operationId: Logout
      responses:
        "204":
          description: No Content
      summary: Initiate logout
      tags:
      - auth
  /oauth/authorize:
    post:
      operationId: StartOAuth
      parameters:
      - description: OAuth2 authorization request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OAuthAuthorizeRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.OAuthAuthorizeResponse'
      summary: Initiate OAuth2 authorization flow
      tags:
      - oauth
  /oauth/callback:
    post:
      operationId: FinishOAuth
      parameters:
      - description: OAuth2 callback request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OAuthCallbackRequest'
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/dto.OAuthCallbackResponse'
      summary: Handle OAuth2 callback
      tags:
      - oauth
  /servers:
    get:
      operationId: GetUserServers
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.Server'
            type: array
      summary: Get servers that the user has access to
      tags:
      - servers
  /users/me:
    get:
      operationId: GetMe
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.User'
      summary: Get authenticated user info
      tags:
      - user
swagger: "2.0"
